[General]
run_num        = 1
task           = "classification"
techniques     = ['LogisticRegression', 'RandomForestClassifier', 'XGBoostClassifier']
metric         = "F1"
hp_selection   = All
validation     = HoldOut
hold_out_ratio = 0.2
y              = "label_anomaly"

[DataPreparation]
input_path    = "inputs/classification_timeseries_example.csv"
time_column   = "timestamp"
window_size   = 5
stride        = 1
normalization = True

[WindowFeatures]
features          = ['mean', 'standard_deviation', 'slope']
y_window_position = "last"

[LogisticRegression]
C = [0.01, 0.1, 1.0, 10.0]

[RandomForestClassifier]
n_estimators = [50, 100]
criterion    = ['gini', 'entropy']
max_depth    = [5, None]
class_weight = [None, 'balanced']

[XGBoostClassifier]
n_estimators     = [50, 100]
learning_rate    = [0.05, 0.1]
max_depth        = [3, 6]
scale_pos_weight = [1, 5]
