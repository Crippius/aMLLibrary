[General]
run_num       = 1
techniques    = ['NNLS']
hp_selection  = All
validation    = HoldOut
hold_out_ratio = 0.2
y             = "response_time_ms"

[DataPreparation]
input_path    = "inputs/timeseries_example.csv"
time_column   = "timestamp"
window_size   = 5
stride        = 1

[WindowFeatures]
features          = ['mean', 'std', 'slope']
y_window_position = "last"
